<style>

#lgName b { font-weight: 700; } #lgName i { font-style: normal; font-weight: 300; color: #4DA3FF; }

        <g id="lgTile" style="transform-origin:256px 256px">

        </g>
        <path id="lgHouse" pathLength="1" d="M118 236 L256 120 L394 236 V384 a20 20 0 0 1 -20 20 H138 a20 20 0 0 1 -20 -20 Z" fill="none" stroke="#fff" stroke-width="26" stroke-linejoin="round" stroke-linecap="round"/>
        <path class="lgW" pathLength="1" d="M176 352 q20 -26 0 -52 q-20 -26 0 -52" fill="none" stroke="#E5484D" stroke-width="20" stroke-linecap="round"/>

<script>
// Tráiler de TermikAI (muestra): el técnico en casa del cliente saca el móvil y de la pantalla sale el piso en
// holograma, con el sol de cada hora y la carga de cada estancia. Todo en 3D (Three.js r128) y sin desenfoques:
// se pinta a 3840 × 2160 en coma flotante y al final se reduce, con grano fino para que no salgan escalones.
// render(t) es determinista (para grabar fotograma a fotograma) y ?t= enseña un instante.
const $ = id => document.getElementById(id);
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const seg = (t, a, b) => clamp((t - a) / (b - a));
const lerp = (a, b, k) => a + (b - a) * k;
const outExpo = x => x >= 1 ? 1 : 1 - Math.pow(2, -10 * x);
const outBack = x => 1 + 2.2 * Math.pow(x - 1, 3) + 1.2 * Math.pow(x - 1, 2);
const inOut = x => x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2;
const smooth = x => x * x * (3 - 2 * x);
// En la web la escena llena su marco (cover). Con ?web los rótulos los pone pro.html, más grandes
if (new URLSearchParams(location.search).has('web')) document.documentElement.classList.add('web');
function fit() { const k = Math.max(innerWidth / 1920, innerHeight / 1080); $('stage').style.transform = `scale(${k}) translate(-50%,-50%)`; }
addEventListener('resize', fit); fit();
let seed = 11; const rnd = () => (seed = (seed * 9301 + 49297) % 233280) / 233280;

// Tiempos (s)
const T = { cutB: 4.6, on: 5.6, tap: 6.8, lift: 7.6, walls: 9.0, sun: 10.6, total: 14.6, cutL: 16.4, end: 21.5 };
window.DURATION = T.end;

// =====================================================================================================
// Motor: supersampling ×2, render en coma flotante (sin escalones), brillo suave y paso final con grano
// =====================================================================================================
const SS = +new URLSearchParams(location.search).get('ss') || 2;   // en la web: 1 en ordenador, menos en el móvil
const renderer = new THREE.WebGLRenderer({ canvas: $('gl'), antialias: true, preserveDrawingBuffer: true, powerPreference: 'high-performance' });
renderer.setPixelRatio(SS); renderer.setSize(1920, 1080, false);
renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.toneMappingExposure = 1.0;
renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap;
const scene = new THREE.Scene(); scene.background = new THREE.Color(0x05070a);
const holo = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(35, 16 / 9, 0.05, 400);

const rt = new THREE.WebGLRenderTarget(1920 * SS, 1080 * SS, { type: THREE.HalfFloatType, format: THREE.RGBAFormat, minFilter: THREE.LinearFilter, magFilter: THREE.LinearFilter });
const composer = new THREE.EffectComposer(renderer, rt); composer.setPixelRatio(SS); composer.setSize(1920, 1080);
composer.addPass(new THREE.RenderPass(scene, camera));
const holoPass = new THREE.RenderPass(holo, camera); holoPass.clear = false; composer.addPass(holoPass); // usa la profundidad del salón: la mano tapa el holograma
const bloom = new THREE.UnrealBloomPass(new THREE.Vector2(1920, 1080), 0.55, 0.35, 0.92); composer.addPass(bloom);
const finalPass = new THREE.ShaderPass({
  uniforms: { tDiffuse: { value: null }, uTime: { value: 0 }, uFade: { value: 1 }, uVig: { value: 0.35 } },
  vertexShader: 'varying vec2 vUv; void main(){ vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }',
  fragmentShader: `uniform sampler2D tDiffuse; uniform float uTime, uFade, uVig; varying vec2 vUv;
    float h(vec2 p){ return fract(sin(dot(p, vec2(12.9898, 78.233))) * 43758.5453); }
    void main(){
      vec3 c = LinearTosRGB(texture2D(tDiffuse, vUv)).rgb;
      vec2 d = (vUv - 0.5) * vec2(1.0, 0.62) * 1.7; c *= 1.0 - uVig * dot(d, d);
      vec2 p = gl_FragCoord.xy + fract(uTime * 13.7) * 211.0;
      float n = h(p) + h(p + 37.1) - 1.0;                       // ruido triangular: tapa los escalones
      float l = dot(c, vec3(0.299, 0.587, 0.114));
      c += n * (1.6 / 255.0 + 0.022 * (1.0 - abs(l - 0.45) * 1.6)); // y algo de grano de película en los medios tonos
      gl_FragColor = vec4(c * uFade, 1.0);
    }` });
composer.addPass(finalPass);

// ---------- utilidades ----------
function rr(w, h, r) {
  const s = new THREE.Shape(), x = -w / 2, y = -h / 2;
  s.moveTo(x + r, y); s.lineTo(x + w - r, y); s.absarc(x + w - r, y + r, r, -Math.PI / 2, 0); s.lineTo(x + w, y + h - r); s.absarc(x + w - r, y + h - r, r, 0, Math.PI / 2);
  s.lineTo(x + r, y + h); s.absarc(x + r, y + h - r, r, Math.PI / 2, Math.PI); s.lineTo(x, y + r); s.absarc(x + r, y + r, r, Math.PI, Math.PI * 1.5); return s;
}
// Caja con cantos redondeados (w × h × d, centrada)
function rbox(w, h, d, r) {
  r = Math.min(r, w / 2 - 0.001, h / 2 - 0.001, d / 2 - 0.001);
  const iw = (w - 2 * r) / 2, ih = (h - 2 * r) / 2, s = new THREE.Shape();
  s.moveTo(-iw, -ih); s.lineTo(iw, -ih); s.lineTo(iw, ih); s.lineTo(-iw, ih); s.lineTo(-iw, -ih);
  const g = new THREE.ExtrudeGeometry(s, { depth: d - 2 * r, bevelEnabled: true, bevelThickness: r, bevelSize: r, bevelSegments: 6, curveSegments: 8 });
  g.translate(0, 0, -(d - 2 * r) / 2); return g;
}
function mapUV(geo, w, h, aspect) {
  const span = Math.min(1, (w / h) / aspect), u0 = (1 - span) / 2, p = geo.attributes.position, uv = new Float32Array(p.count * 2);
  for (let i = 0; i < p.count; i++) { uv[i * 2] = u0 + (p.getX(i) / w + 0.5) * span; uv[i * 2 + 1] = p.getY(i) / h + 0.5; }
  geo.setAttribute('uv', new THREE.BufferAttribute(uv, 2)); return geo;
}
const canvasTex = (w, h, draw, srgb = true) => { const c = document.createElement('canvas'); c.width = w; c.height = h; draw(c.getContext('2d'), w, h); const t = new THREE.CanvasTexture(c); if (srgb) t.encoding = THREE.sRGBEncoding; t.anisotropy = 16; return t; };
const radialTex = (stops) => canvasTex(256, 256, g => { const gr = g.createRadialGradient(128, 128, 0, 128, 128, 128); stops.forEach(([o, c]) => gr.addColorStop(o, c)); g.fillStyle = gr; g.fillRect(0, 0, 256, 256); });
const loadTex = url => new Promise(res => new THREE.TextureLoader().load(url, t => { t.encoding = THREE.sRGBEncoding; t.anisotropy = 16; res(t); }));
const std = (color, rough = 0.8, extra = {}) => new THREE.MeshStandardMaterial(Object.assign({ color, roughness: rough, metalness: 0 }, extra));
const add = (parent, geo, mat, x = 0, y = 0, z = 0, cast = true, recv = true) => { const m = new THREE.Mesh(geo, mat); m.position.set(x, y, z); m.castShadow = cast; m.receiveShadow = recv; parent.add(m); return m; };
// Cápsula a lo largo de Y, de largo L entre los centros de las semiesferas
function capsuleGeo(r, L) {
  const pts = [], n = 10;
  for (let i = 0; i <= n; i++) { const a = -Math.PI / 2 + (i / n) * Math.PI / 2; pts.push(new THREE.Vector2(Math.cos(a) * r, Math.sin(a) * r - L / 2)); }
  for (let i = 0; i <= n; i++) { const a = (i / n) * Math.PI / 2; pts.push(new THREE.Vector2(Math.cos(a) * r, Math.sin(a) * r + L / 2)); }
  pts[0].x = 0.0001; pts[pts.length - 1].x = 0.0001;
  return new THREE.LatheGeometry(pts, 28);
}
const Y = new THREE.Vector3(0, 1, 0), vA = new THREE.Vector3(), vB = new THREE.Vector3();
function between(m, a, b) { vA.set(...a); vB.set(...b); m.position.copy(vA).add(vB).multiplyScalar(0.5); const d = vB.sub(vA); const l = d.length(); m.quaternion.setFromUnitVectors(Y, d.normalize()); m.scale.set(1, l / m.userData.L, 1); }

// =====================================================================================================
// El salón del cliente (1 unidad = 10 cm): 6 × 5 m, 2,7 m de alto; ventanal al oeste con el sol de la tarde
// =====================================================================================================
const RM = { x: 30, z: 25, h: 27 };
const room = new THREE.Group(); scene.add(room);
const L = {}; // luces del salón (se atenúan cuando sale el holograma)
function buildRoom() {
  // Suelo de tarima
  const wood = canvasTex(2048, 2048, (c, w, h) => {
    const pw = 128; seed = 3;
    for (let y = 0; y < h; y += pw) {
      let x = -rnd() * 900;
      while (x < w) {
        const len = 700 + rnd() * 700, k = 0.86 + rnd() * 0.22;
        c.fillStyle = `rgb(${Math.round(176 * k)},${Math.round(142 * k)},${Math.round(104 * k)})`; c.fillRect(x, y, len, pw);
        for (let i = 0; i < 26; i++) { c.strokeStyle = `rgba(90,60,30,${0.05 + rnd() * 0.08})`; c.lineWidth = 1 + rnd() * 2; const yy = y + rnd() * pw; c.beginPath(); c.moveTo(x, yy); c.bezierCurveTo(x + len * 0.3, yy + (rnd() - .5) * 14, x + len * 0.7, yy + (rnd() - .5) * 14, x + len, yy + (rnd() - .5) * 8); c.stroke(); }
        c.fillStyle = 'rgba(40,25,10,.55)'; c.fillRect(x, y, 3, pw); x += len;
      }
      c.fillStyle = 'rgba(40,25,10,.6)'; c.fillRect(0, y, w, 3);
    }
  });
  wood.wrapS = wood.wrapT = THREE.RepeatWrapping; wood.repeat.set(3, 2.5);
  add(room, new THREE.PlaneGeometry(RM.x * 2, RM.z * 2), std(0xffffff, 0.55, { map: wood, envMapIntensity: 0.7 }), 0, 0, 0, false, true).rotation.x = -Math.PI / 2;
  // Paredes y techo (todo proyecta sombra: así el sol solo entra por el ventanal)
  const wallMat = std(0xe3ddd3, 0.92, { envMapIntensity: 0.5 });
  const wall = (w, h, d, x, y, z) => add(room, new THREE.BoxGeometry(w, h, d), wallMat, x, y, z);
  wall(RM.x * 2 + 2, RM.h, 1, 0, RM.h / 2, -RM.z - 0.5);           // fondo (norte)
  wall(RM.x * 2 + 2, RM.h, 1, 0, RM.h / 2, RM.z + 0.5);            // delante (detrás de la cámara)
  wall(1, RM.h, RM.z * 2, RM.x + 0.5, RM.h / 2, 0);                // este
  add(room, new THREE.BoxGeometry(RM.x * 2 + 2, 1, RM.z * 2 + 2), std(0xf2efe9, 0.95), 0, RM.h + 0.5, 0);   // techo
  // Oeste, con el ventanal: z de -12 a 8, y de 6 a 24
  const WZ = [-12, 8], WY = [6, 24], X0 = -RM.x - 0.5;
  wall(1, WY[0], RM.z * 2, X0, WY[0] / 2, 0);
  wall(1, RM.h - WY[1], RM.z * 2, X0, (RM.h + WY[1]) / 2, 0);
  wall(1, WY[1] - WY[0], WZ[0] + RM.z, X0, (WY[0] + WY[1]) / 2, (WZ[0] - RM.z) / 2);
  wall(1, WY[1] - WY[0], RM.z - WZ[1], X0, (WY[0] + WY[1]) / 2, (WZ[1] + RM.z) / 2);
  // Carpintería de aluminio gris oscuro
  const alu = std(0x2a2d32, 0.4, { metalness: 0.6 });
  const fr = (w, h, d, x, y, z) => add(room, new THREE.BoxGeometry(w, h, d), alu, x, y, z);
  fr(1.4, 0.6, WZ[1] - WZ[0] + 0.6, X0, WY[0], (WZ[0] + WZ[1]) / 2); fr(1.4, 0.6, WZ[1] - WZ[0] + 0.6, X0, WY[1], (WZ[0] + WZ[1]) / 2);
  fr(1.4, WY[1] - WY[0], 0.6, X0, (WY[0] + WY[1]) / 2, WZ[0]); fr(1.4, WY[1] - WY[0], 0.6, X0, (WY[0] + WY[1]) / 2, WZ[1]);
  fr(1.2, WY[1] - WY[0], 0.45, X0, (WY[0] + WY[1]) / 2, (WZ[0] + WZ[1]) / 2); fr(1.2, 0.35, WZ[1] - WZ[0], X0, 18, (WZ[0] + WZ[1]) / 2);
  const sill = add(room, new THREE.BoxGeometry(3, 0.5, WZ[1] - WZ[0] + 2), std(0xd8d2c8, 0.6), X0 + 1, WY[0] - 0.25, (WZ[0] + WZ[1]) / 2);
  // Fuera: cielo de tarde con la ciudad (sin naranja: bruma clara y edificios en gris azulado)
  const sky = canvasTex(2048, 1024, (c, w, h) => {
    const g = c.createLinearGradient(0, 0, 0, h); g.addColorStop(0, '#7f9bb8'); g.addColorStop(0.55, '#c9d3da'); g.addColorStop(0.8, '#f1e9da'); g.addColorStop(1, '#f6efe2');
    c.fillStyle = g; c.fillRect(0, 0, w, h); seed = 21;
    for (let i = 0; i < 26; i++) {
      const bw = 70 + rnd() * 160, bh = 120 + rnd() * 330, bx = rnd() * w, by = h - bh;
      c.fillStyle = `rgba(${86 + rnd() * 20},${98 + rnd() * 20},${116 + rnd() * 20},${0.55 + rnd() * 0.3})`; c.fillRect(bx, by, bw, bh);
      c.fillStyle = 'rgba(255,240,215,.18)'; for (let yy = by + 16; yy < h - 10; yy += 26) for (let xx = bx + 10; xx < bx + bw - 12; xx += 22) if (rnd() > 0.55) c.fillRect(xx, yy, 9, 12);
    }
  });
  const out = new THREE.Mesh(new THREE.PlaneGeometry(130, 65), new THREE.MeshBasicMaterial({ map: sky, color: new THREE.Color(1.7, 1.7, 1.7) }));

const TEX = {};
